
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Data Processing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Employee Data Processing System</h1>
        <p>Manage and analyze employee information</p>
    </header>

    <main>

        <section>
            <h2>All Employees</h2>
            <button id="allEmployeesBtn">View All Employees</button>
        </section>

        <section>
            <h2>Filter by Department</h2>

            <select id="department">
                <option value="">Select Department</option>
                <option value="IT">IT</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
            </select>

            <button id="departmentBtn">Find Department</button>
        </section>

        <section>
            <h2>Employees Earning Above ₦200,000</h2>
            <button id="salaryBtn">Find Employees</button>
        </section>

        <section>
            <h2>Average Employee Salary</h2>
            <button id="averageBtn">Calculate Average Salary</button>
        </section>

        <section>
            <h2>Highest Paid Employee</h2>
            <button id="highestBtn">Find Highest Salary</button>
        </section>

        <section>
            <h2>Employee Names</h2>
            <button id="namesBtn">Display Names</button>
        </section>

        <section id="resultsSection">
            <h2>Results</h2>
            <div id="results">
                <p>Select an operation to see results.</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
