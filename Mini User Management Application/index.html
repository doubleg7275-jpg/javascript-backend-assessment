<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mini User Management System</h1>
        <p>Register, view, search, update and delete users.</p>
    </header>

    <main>

        <!-- User Registration Form -->
        <section>
            <h2>Register New User</h2>

            <form id="userForm">

                <input type="hidden" id="editingUserId">

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter full name">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">

                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter age">

                <button type="submit" id="submitBtn">Register User</button>
                <button type="button" id="cancelEditBtn" hidden>Cancel Update</button>

            </form>

            <div id="message"></div>
        </section>


        <!-- Retrieve All Users -->
        <section>
            <h2>All Registered Users</h2>

            <button id="getAllBtn">View All Users</button>

            <div id="usersList" hidden></div>
        </section>


        <!-- Retrieve One User by ID -->
        <section>
            <h2>Find User by ID</h2>

            <input type="number" id="userId" placeholder="Enter user ID">

            <button id="getUserBtn">Find User</button>

            <div id="singleUserResult"></div>
        </section>


        <!-- Search Users by Name -->
        <section>
            <h2>Search Users by Name</h2>

            <input type="text" id="searchName" placeholder="Enter user's name">

            <button id="searchBtn">Search</button>

            <div id="searchResults"></div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
