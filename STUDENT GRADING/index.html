<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>
</head>
<body>
    <h1>Student Grading System</h1>
    <div class="div1">
        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name">
        <h3>Subjects & Scores</h3>
        <label for="mathematics">Mathematics:</label>
        <input type="number" id="mathematics" name="mathematics" min="0" max="100" step="1"> <br> <br>
        <label for="english">English:</label> 
        <input type="number" id="english" name="english" min="0" max="100" step="1"> <br> <br>
        <label for="chemistry">Chemistry:</label>
        <input type="number" id="chemistry" name="chemistry" min="0" max="100" step="1"> <br> <br>
        <label for="physics">Physics:</label>
        <input type="number" id="physics" name="physics" min="0" max="100" step="1"> <br>  <br>
        <label for="biology">Biology:</label>
        <input type="number" id="biology" name="biology" min="0" max="100" step="1"> <br> <br>

    </div>
        <div id="studentName"></div>
        <div id="grade"></div>
        <div id="totalScore"></div>
        <div id="average"></div>
        <button type="button" id="calculateGrade" onclick="calculateGrade()">Calculate Grade</button>
         <button type="button" id="calculateTotalScore" onclick="calculateTotalScore()">Calculate Total Score</button>
        <button type="button" id="calculateAverage" onclick="calculateAverage()">Calculate Average</button>
        <button type="button" id="displayAll" onclick="displayAll()">Display All</button>

    <script src="script.js"></script>
</body>
</html>
