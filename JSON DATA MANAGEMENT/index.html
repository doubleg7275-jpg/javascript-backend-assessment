<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>User Information Management</h1>

    <p>Search for a user using their email address.</p>

    <input
        type="email"
        id="searchEmail"
        placeholder="Enter user's email"
    >

    <button id="searchBtn">Search User</button>

    <h2>Search Result</h2>

    <div id="result">
        User information will appear here.
    </div>

    <h2>JSON String</h2>
    <pre id="jsonData"></pre>

    <script src="script.js"></script>

</body>
</html>
