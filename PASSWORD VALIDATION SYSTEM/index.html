<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validation</title>
</head>
<body>
    <form id="password-form" novalidate>
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            placeholder="Input Password"
            minlength="8"
            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).*"
            required
        >
        <br><br>
        <input type="submit" value="Submit">
    </form>
    <p id="password-message" role="status"></p>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordForm = document.getElementById('password-form');
        const passwordMessage = document.getElementById('password-message');

        passwordForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const password = passwordInput.value;
            const missingRequirements = [];

            if (password.length < 8) {
                missingRequirements.push('at least 8 characters');
            }
            if (!/[A-Z]/.test(password)) {
                missingRequirements.push('at least one uppercase letter');
            }
            if (!/[a-z]/.test(password)) {
                missingRequirements.push('at least one lowercase letter');
            }
            if (!/[0-9]/.test(password)) {
                missingRequirements.push('at least one number');
            }
            if (!/[^A-Za-z0-9]/.test(password)) {
                missingRequirements.push('at least one special character');
            }

            if (missingRequirements.length > 0) {
                passwordMessage.textContent = `Please include ${missingRequirements.join(', ')}.`;
            } else {
                passwordMessage.textContent = 'Password is valid.';
            }
        });   
         </script>
</body>
</html>
