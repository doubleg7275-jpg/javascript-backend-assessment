<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Calculator</title>
</head>
<body>
    <main>
        <h1>Employee Salary Calculator</h1>
        <p>Enter the employee details to calculate the monthly take-home salary.</p>

        <form id="salaryForm">
            <div>
                <label for="employeeName">Employee name</label>
                <input id="employeeName" name="employeeName" type="text" required>
            </div>
            <div>
                <label for="basicSalary">Basic salary</label>
                <input id="basicSalary" name="basicSalary" type="number" min="0" step="0.01" required>
            </div>
            <div>
                <button type="submit">Calculate Salary</button>
                <button id="resetButton" type="button">Reset</button>
            </div>
        </form>

        <div id="salaryBreakdown" aria-live="polite"></div>
        <p id="errorMessage" role="alert"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
